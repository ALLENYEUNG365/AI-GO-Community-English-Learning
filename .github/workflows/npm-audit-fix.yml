name: NPM Audit Fix

on:
  push:
    branches: [security/npm-audit-fix]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'ALLENYEUNG365' && !contains(github.event.head_commit.message, '[npm-audit-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile with security overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact lockfile
        run: npm ci

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Verify Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Verify production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          NEXTAUTH_SECRET: ci-only-secret
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "security: refresh audited dependencies [npm-audit-fix]"
          git push
