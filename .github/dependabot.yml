version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase
    groups:
      prisma-orm:
        applies-to: version-updates
        patterns:
          - "prisma"
          - "@prisma/client"
      prisma-security:
        applies-to: security-updates
        patterns:
          - "prisma"
          - "@prisma/client"
    # Competition/production baseline: disable automatic version-update PRs.
    # Security updates remain enabled and can still be proposed, including major security fixes.
    # Major upgrades should be evaluated in a dedicated migration branch with full regression testing.
