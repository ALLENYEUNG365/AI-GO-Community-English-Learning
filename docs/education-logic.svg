<text x="800" y="305" fill="#62b8ff" font-size="25" font-weight="700">3. PRACTICE</text><text x="800" y="345" fill="#fff" font-size="20">Learn + interact</text><text x="800" y="375" fill="#b8c2d1" font-size="17">Video • Reading • Chat</text>
