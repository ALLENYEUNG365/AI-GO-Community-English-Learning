<text x="1095" y="305" fill="#71e0ae" font-size="25" font-weight="700">4. AI FEEDBACK</text><text x="1095" y="345" fill="#fff" font-size="20">AI tutoring</text><text x="1095" y="375" fill="#b8c2d1" font-size="17">Guidance + suggestions</text>
<rect x="1275" y="250" width="230" height="140" rx="28" fill="#17233a" stroke="#bc8cff" stroke-width="3"/>
<text x="1390" y="305" fill="#c89dff" font-size="25" font-weight="700">5. COMMUNITY</text><text x="1390" y="345" fill="#fff" font-size="20">Share + encourage</text><text x="1390" y="375" fill="#b8c2d1" font-size="17">Social reinforcement</text>
