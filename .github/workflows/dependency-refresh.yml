name: Dependency Refresh

on:
  push:
    branches: [security/dependency-refresh]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'ALLENYEUNG365' && !contains(github.event.head_commit.message, '[dependency-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh security-critical dependencies
        run: npm install next@15.5.24 eslint-config-next@15.5.24 next-auth@4.24.15 --save-exact

      - name: Verify install and build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          NEXTAUTH_SECRET: ci-only-secret
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "security: refresh Next.js and NextAuth dependencies [dependency-refresh]"
          git push
