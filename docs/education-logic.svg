<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" rx="40" fill="#0b1220"/>
<text x="90" y="95" fill="#fff" font-family="Arial, sans-serif" font-size="44" font-weight="700">AI GO Community English Learning</text>
<text x="90" y="145" fill="#9ca9bd" font-family="Arial, sans-serif" font-size="24">Education Logic • From access to habit, practice, feedback and community reinforcement</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="95" y="250" width="230" height="140" rx="28" fill="#17233a" stroke="#ff9d00" stroke-width="3"/>
<text x="210" y="305" fill="#ffb33b" font-size="25" font-weight="700">1. ACCESS</text><text x="210" y="345" fill="#fff" font-size="20">Easy sign-in</text><text x="210" y="375" fill="#b8c2d1" font-size="17">Learner profile</text>
<rect x="390" y="250" width="230" height="140" rx="28" fill="#17233a" stroke="#ffb13b" stroke-width="3"/>
<text x="505" y="305" fill="#ffb33b" font-size="25" font-weight="700">2. BUILD HABIT</text><text x="505" y="345" fill="#fff" font-size="20">Daily check-in</text><text x="505" y="375" fill="#b8c2d1" font-size="17">Streaks + points</text>
