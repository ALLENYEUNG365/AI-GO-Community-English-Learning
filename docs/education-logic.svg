<text x="800" y="590" fill="#fff" font-size="30" font-weight="700">LEARNING OUTCOME</text>
<text x="800" y="635" fill="#dbe5f2" font-size="22">Confidence • consistency • practical communication • lifelong learning</text>
<text x="800" y="675" fill="#8fd7ff" font-size="20">The loop returns learners to the next challenge instead of ending after one lesson.</text>
